<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mockup final — Fitur Penugasan (SAFAR OPS 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --page:#ECEAE4; --appbg:#FAF9F6; --surface:#FFFFFF; --surface2:#F6F3EC; --text:#1F1B12; --muted:#7A7468; --line:#ECE6D8;
  --gold:#9A6B0C; --goldbg:#FBF2D9; --acc:#B4500A; --accbg:#FDEDE0; --red:#B4372A; --redbg:#FBE9E6; --green:#2D7A4E; --greenbg:#E5F3EA; --blue:#2D5B96; --bluebg:#E7EEF8;
  --grey:#6A665E; --greybg:#EFEDE8; --btn:#D9590A; --btntext:#FFFFFF; --frame:#1E1C18; --overlay:rgba(25,18,5,.48);
  --sh:0 1px 2px rgba(60,40,0,.05),0 6px 18px rgba(60,40,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#12110E; --appbg:#1A1814; --surface:#24211B; --surface2:#2C2821; --text:#F3EFE5; --muted:#A9A190; --line:#3A352C;
    --gold:#EDBE4C; --goldbg:#3A2F14; --acc:#F5A15E; --accbg:#3B2414; --red:#F2917F; --redbg:#3E211C; --green:#86D0A2; --greenbg:#1C3427; --blue:#93B6E8; --bluebg:#1D2A3E;
    --grey:#B9B3A7; --greybg:#302C25; --btn:#F08A3A; --btntext:#1F1B12; --frame:#000; --overlay:rgba(0,0,0,.6);
    --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#12110E; --appbg:#1A1814; --surface:#24211B; --surface2:#2C2821; --text:#F3EFE5; --muted:#A9A190; --line:#3A352C;
  --gold:#EDBE4C; --goldbg:#3A2F14; --acc:#F5A15E; --accbg:#3B2414; --red:#F2917F; --redbg:#3E211C; --green:#86D0A2; --greenbg:#1C3427; --blue:#93B6E8; --bluebg:#1D2A3E;
  --grey:#B9B3A7; --greybg:#302C25; --btn:#F08A3A; --btntext:#1F1B12; --frame:#000; --overlay:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--font);background:var(--page);color:var(--text);-webkit-font-smoothing:antialiased}
button{font-family:var(--font)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #E8650A;outline-offset:2px}
.top{position:sticky;top:0;z-index:50;background:var(--page);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.top h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
.top h1 small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.tabs,.seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;border:1px solid var(--line)}
.tabs button,.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font:600 13px var(--font);color:var(--muted);cursor:pointer}
.tabs button.on,.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh)}
.stage{display:flex;flex-direction:column;align-items:center;padding:14px 12px 40px;gap:12px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.lnk{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 12px;font:600 12.5px var(--font);cursor:pointer}
.phone{width:390px;max-width:100%;height:min(844px,calc(100vh - 140px));min-height:600px;border:10px solid var(--frame);border-radius:44px;overflow:hidden;position:relative;background:var(--appbg);box-shadow:0 24px 60px rgba(0,0,0,.18)}
@media (max-width:480px){.phone{border:0;border-radius:0;height:calc(100vh - 130px);width:100%;box-shadow:none}.stage{padding:8px 0 0}}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:24px}

/* App chrome */
.home-hd{background:linear-gradient(180deg,#EE7A1F 0%,#DC5F0A 100%);color:#FFFFFF;padding:20px 18px 56px;border-radius:0 0 22px 22px;display:flex;justify-content:space-between;align-items:flex-start}
.home-hd .h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.home-hd .hi{font-size:14px;margin-top:2px}
.ava{width:42px;height:42px;border-radius:50%;background:#14120D;color:#fff;display:grid;place-items:center;font-weight:700}
.datecard{margin:-52px 14px 0;background:var(--surface);border-radius:18px;box-shadow:var(--sh);border:1px solid var(--line)}
.datecard .dt{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.datecard .dt b{font-size:15px}.datecard .dt small{display:block;color:var(--muted);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats div{text-align:center;padding:12px 4px}.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:20px;color:var(--acc);font-weight:800}.stats small{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.sect-t{font:700 11px var(--font);letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin:20px 18px 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 6px 11px;text-align:center;cursor:pointer;min-height:96px}
.menu .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin:0 auto 7px;background:var(--accbg);color:var(--acc)}
.menu b{font-size:12.5px;display:block;line-height:1.25}
.menu small{font-size:10.5px;color:var(--muted);display:block;margin-top:2px;line-height:1.3}
.menu.hot{border:1.5px solid #F0A065;background:var(--accbg)}
.menu.hot .ico{background:#E8650A;color:#FFFFFF}
.hd{background:linear-gradient(180deg,#EE7A1F 0%,#DC5F0A 100%);color:#FFFFFF;padding:10px 14px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
.bk{position:relative;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.22);display:grid;place-items:center;cursor:pointer;color:#FFFFFF;flex:none}
.hd-t{font-weight:800;font-size:17px;letter-spacing:-.01em}.hd-s{font-size:12px;opacity:.75}
.pad{padding:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.mt{margin-top:10px}.mt2{margin-top:16px}
.lab{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px}
.inp,.sel,textarea.inp{width:100%;padding:8px 12px;min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:500 14px var(--font)}
textarea.inp{min-height:84px;resize:vertical;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:8px 14px;min-height:36px;font:600 14px var(--font);cursor:pointer;background:var(--btn);color:var(--btntext);text-align:center}
.btn.sec{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.warn{background:var(--redbg);color:var(--red)}
.btn.sm{padding:6px 11px;min-height:32px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btns{display:flex;gap:8px}.btns>*{flex:1}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font:700 11px var(--font);white-space:nowrap}
.b-green{background:var(--greenbg);color:var(--green)}.b-blue{background:var(--bluebg);color:var(--blue)}.b-grey{background:var(--greybg);color:var(--grey)}.b-red{background:var(--redbg);color:var(--red)}.b-gold{background:var(--goldbg);color:var(--gold)}
.alert{border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45}
.alert.err{background:var(--redbg);color:var(--red)}.alert.ok{background:var(--greenbg);color:var(--green)}.alert.info{background:var(--accbg);color:var(--acc)}.alert.mute{background:var(--greybg);color:var(--grey)}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.row:last-child{border-bottom:0}.row span:first-child{color:var(--muted);flex:none}.row span:last-child{text-align:right;font-weight:600;word-break:break-word}
.li{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface)}
.li:last-child{border-bottom:0}
.li-ic{width:38px;height:38px;border-radius:10px;background:var(--accbg);display:grid;place-items:center;font-size:19px;flex:none}
.li-b{flex:1;min-width:0}.li-b b{display:block;font-size:13.5px;line-height:1.3}.li-b small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-all}
.listbox{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.qh{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px}
.qh b{font-size:14px}.qh span{font-size:12px;color:var(--muted)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 6px;text-align:center;cursor:pointer;font:600 11.5px var(--font);color:var(--text);line-height:1.25}
.act .ico{width:36px;height:36px;border-radius:10px;background:var(--accbg);color:var(--acc);display:grid;place-items:center;margin:0 auto 6px}
.srch{display:flex;gap:8px}
.qbox{position:relative}.qbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}.qbox .inp{padding-left:38px}
.icbtn{width:44px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.snrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface2);margin-top:6px;font-size:12.5px}
.snrow b{font-weight:700;word-break:break-all}.snrow small{display:block;color:var(--muted);font-size:11px}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px;display:grid;place-items:center}
.unit{border:1.5px dashed var(--line);border-radius:12px;padding:10px;margin-top:8px}
.unit-h{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.part{margin-left:12px;border-left:2px solid var(--line);padding-left:8px}
.sticky-foot{position:sticky;bottom:0;padding:12px 14px;background:linear-gradient(180deg,transparent,var(--appbg) 30%)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:1px;accent-color:#D9590A;flex:none}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;background:var(--surface)}
.opt.on{border-color:#E8650A;background:var(--accbg)}
.opt input{margin-top:3px;accent-color:#D9590A}
.opt b{font-size:13.5px;display:block}.opt small{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.doc{background:#fff;color:#1a1a1a;border-radius:10px;padding:16px;border:1px solid #ddd;font-size:12px}
.doc h3{margin:0 0 2px;font-size:14px;letter-spacing:.04em}
.doc table{width:100%;border-collapse:collapse;margin-top:10px}
.doc th,.doc td{border:1px solid #ccc;padding:5px;text-align:left;vertical-align:top}
.doc th{background:#f3f3f3}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;text-align:center}
.sig div{padding-top:44px;border-bottom:1px solid #999;font-size:11px}
.lblgrid{display:grid;grid-template-columns:1fr;gap:8px}
.lbl{border:1px dashed #9a9a9a;border-radius:8px;padding:8px;display:flex;gap:10px;background:#fff;color:#111;align-items:center}
.lbl .t{font-size:11px;line-height:1.35}.lbl .t b{font-size:11.5px}
.mtabs{display:flex;gap:6px;padding:12px 14px 0}
.mtabs button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:6px;min-height:32px;font:600 12.5px var(--font);cursor:pointer;position:relative}
.mtabs button.on{background:var(--btn);color:var(--btntext);border-color:transparent}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:4px 10px;min-height:26px;font:600 12px var(--font);cursor:pointer;white-space:nowrap;position:relative}
.pill.on{background:var(--btn);color:var(--btntext);border-color:transparent}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.voidli{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}

/* Konsumen */
.c-hd{background:linear-gradient(180deg,#EE7A1F 0%,#DC5F0A 100%);color:#FFFFFF;padding:22px 18px 22px}
.c-hd .brand{font-weight:800;font-size:13px;letter-spacing:.02em;opacity:.8}
.c-hd .ttl{font-weight:800;font-size:24px;letter-spacing:-.02em;margin-top:2px}
.c-hd .sub{font-size:13px;margin-top:4px;opacity:.8}
.sum{display:flex;gap:8px;margin-top:12px}
.sum div{flex:1;background:rgba(255,255,255,.6);border-radius:12px;padding:8px 10px}
.sum b{font-size:18px;display:block}.sum small{font-size:11px}
.notice{display:flex;gap:8px;align-items:flex-start;background:var(--accbg);color:var(--acc);border-radius:12px;padding:9px 11px;font-size:12.5px;line-height:1.4;font-weight:600}
.cc{display:flex;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px;margin-top:9px}
.cph{width:52px;height:52px;border-radius:12px;background:var(--accbg);display:grid;place-items:center;font-size:25px;flex:none}
.cb{flex:1;min-width:0}
.cn{font-weight:700;font-size:13.5px;line-height:1.3}
.cm{font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-all}
.cr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:12px;font-weight:600}
.cact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.note{margin-top:8px;font-size:12px;background:var(--surface2);border-radius:10px;padding:7px 9px;display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.note span{word-break:break-word}
.addnote{margin-top:8px;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:7px 9px;font:600 12px var(--font);cursor:pointer;width:100%;text-align:left}
.tl{margin:10px 0 2px 6px;border-left:2px solid var(--line);padding-left:14px}
.tl .st{position:relative;padding:0 0 10px;font-size:12px;line-height:1.35}
.tl .st:last-child{padding-bottom:0}
.tl .st:before{content:'';position:absolute;left:-20px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl .st.done:before{background:var(--green);border-color:var(--green)}
.tl .st.cur:before{background:#F08A3A;border-color:#E8650A}
.tl .st.rej:before{background:var(--red);border-color:var(--red)}
.tl .st b{display:block;font-weight:600}.tl .st small{color:var(--muted)}
.cstat{margin-top:8px;font-size:12.5px;font-weight:700;padding:7px 9px;border-radius:10px;background:var(--bluebg);color:var(--blue)}
.parts{margin:6px 0 0 18px;border-left:2px dashed var(--line);padding-left:8px}
.parts .cc{padding:9px}.parts .cph{width:40px;height:40px;font-size:19px}

/* Layers */
.layer{position:absolute;inset:0;background:var(--overlay);display:flex;align-items:flex-end;z-index:20}
.layer.center{align-items:center;justify-content:center}
.layer.fv{background:rgba(0,0,0,.92);align-items:center;justify-content:center;z-index:40}
.fv-img{width:88%;aspect-ratio:3/4;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:rgba(255,255,255,.8);font:600 14px var(--font);touch-action:pan-y}
.fv-x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer}
.fv-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer}
.fv-nav.l{left:8px}.fv-nav.r{right:8px}.fv-nav:disabled{opacity:.25;cursor:default}
.fv-c{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#fff;font:600 13px var(--font)}
.fbtn{border:0;padding:0;cursor:zoom-in}
.fcount .fotos{margin-top:6px}
.rdby{font-weight:700;letter-spacing:.02em}.rdby.all{color:#2F7FD8}
.nfin .cc{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--greybg);color:var(--grey);font:700 10.5px var(--font);vertical-align:1px}
.sheet{background:var(--surface);width:100%;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px 22px}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.sh-h b{font-size:16px}
.vf{height:150px;border-radius:16px;background:#111;position:relative;overflow:hidden;display:grid;place-items:center;color:#ddd;font-size:12px}
.vf .box{position:absolute;inset:26px 70px;border:2px solid #F08A3A;border-radius:12px}
.vf .ln{position:absolute;left:70px;right:70px;height:2px;background:#F08A3A;top:30px;animation:scan 1.8s ease-in-out infinite alternate}
@keyframes scan{to{top:122px}}
@media (prefers-reduced-motion: reduce){.vf .ln{animation:none;top:74px}}
.vf span{position:absolute;bottom:8px}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:10px;padding:8px 10px;cursor:pointer;font:600 12.5px var(--font)}
.chip small{color:var(--muted);font-weight:500;font-size:11px;text-align:right}
.sub-t{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.loader{background:var(--surface);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;width:240px;text-align:center;font-size:13px;font-weight:600}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:#E8650A;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:absolute;left:12px;right:12px;bottom:72px;background:#1F1B12;color:#fff;border-radius:12px;padding:10px 12px;font-size:12.5px;z-index:40;box-shadow:0 8px 20px rgba(0,0,0,.25);line-height:1.4}
.nb{margin:12px 14px 0;border-radius:16px;padding:12px;border:1.5px solid #F0A065;background:var(--accbg)}
.nb.late{border-color:var(--red);background:var(--redbg)}
.nb-h{display:flex;gap:8px;align-items:center;font-weight:800;font-size:13.5px}
.nb-i{display:block;width:100%;text-align:left;border:0;background:var(--surface);color:var(--text);border-radius:10px;padding:8px 10px;margin-top:6px;font:500 12px var(--font);cursor:pointer;line-height:1.35}
.nb-i b{font-weight:700}
.tg{display:block;margin-top:3px;font-weight:700;font-size:11.5px}
.tg.late{color:var(--red)}.tg.soon{color:var(--acc)}.tg.ok{color:var(--muted)}
.vtag{font:700 10.5px var(--font);padding:2px 7px;border-radius:999px;background:var(--bluebg);color:var(--blue);margin-left:6px}
.cdw{position:relative;width:68px;height:68px;margin:4px auto 10px}
.cdi{position:absolute;inset:0;display:grid;place-items:center}
.cdn{position:absolute;right:-3px;top:-3px;color:#fff;border-radius:50%;width:24px;height:24px;font:800 12px var(--font);display:grid;place-items:center;border:2px solid var(--surface)}
.kb{margin-top:6px;display:inline-block;white-space:normal;max-width:100%;line-height:1.3}

const isOwner = u => OWNERS.includes(u);
const teamById = id => S.teams.find(t=>t.id===id);
const ledTeam = u => S.teams.find(t=>t.leader===u);
const leadersOf = u => S.teams.filter(t=>t.staff.includes(u)).map(t=>t.leader);
const members = t => t ? [t.leader, ...t.staff] : [];
const progById = id => S.prog.find(p=>p.id===id);
const tugasById = id => S.tugas.find(g=>g.id===id);
const lapByNo = no => S.lap.find(l=>l.no===no);
const leaderOfProg = p => teamById(p.team).leader;
const canManageProg = (p,u=S.me) => isOwner(u) || leaderOfProg(p)===u;
const isLate = t => !t.done && t.dl && diffDays(t.dl,TODAY)<0;
/* tingkat kedekatan DL: 5 terlambat, 4 hari ini, 3 H-1, 2 H-2, 1 H-3 */
function dueRank(t){ if(t.done||!t.dl) return 0; const n=diffDays(t.dl,TODAY); return n<0?5:n===0?4:n<=3?4-n:0; }
const DUE = {5:['terlambat','Terlambat','b-late'],4:['hari ini','Hari ini','b-brick'],3:['H-1','H-1','b-brick'],2:['H-2','H-2','b-gold'],1:['H-3','H-3','b-gold']};
const dueBadge = t => { const r=dueRank(t); return r?`<span class="badge ${DUE[r][2]}">${DUE[r][1]}</span>`:''; };
function worstDue(todos){ let r=0; todos.forEach(t=>{ r=Math.max(r,dueRank(t)); }); return r; }
function progressOf(g){ const n=g.todos.length+1; const dn=g.todos.filter(t=>t.done).length+(g.closed?1:0); return {n, dn, pct:Math.round(dn/n*100)}; }
function visibleTugas(p,u=S.me){ const arr=S.tugas.filter(g=>g.prog===p.id); if(canManageProg(p,u)) return arr; return arr.filter(g=>g.todos.some(t=>t.pic===u)); }
function visibleProgs(u=S.me){ return S.prog.filter(p=>canManageProg(p,u) || visibleTugas(p,u).length); }
function canSeeLap(l,u=S.me){ return isOwner(u) || l.from===u || l.to===u || l.cc.includes(u) || leadersOf(l.to).includes(u); }
const lapClosed = l => l.status==='Selesai' || l.status==='Ditolak';
function notify(u, t, go){ if(!u||u===S.me) return; (S.notif[u]=S.notif[u]||[]).unshift({t, at:TODAY, go, read:false}); }
function logT(g,t){ g.log.push({at:TODAY, t:nm(S.me)+' '+t}); }
function logL(l,t){ l.log.push({at:TODAY, t:nm(S.me)+' '+t}); }
function roleLabel(u){ if(isOwner(u)) return 'Pemilik'; const r=[]; const lt=ledTeam(u); if(lt) r.push('Leader '+lt.nama); S.teams.filter(t=>t.staff.includes(u)).forEach(t=>r.push('Staff '+t.nama)); return r.join(' · ')||'Belum masuk tim'; }

      </div></div>`;
    } else {
      h+=`<div class="layer"><div class="sheet" role="dialog" aria-label="${esc(m.title)}">

}
function render(){

  const ae=document.activeElement, fid=ae&&ae.id&&document.getElementById('app').contains(ae)?ae.id:null;
  let sel=null; try{ if(fid && ae.selectionStart!=null) sel=[ae.selectionStart, ae.selectionEnd]; }catch(e){}
  const sc=document.getElementById('scr'), st=sc?sc.scrollTop:0;
  const key = S.me+'|'+S.k.screen+'|'+(S.k.ref||'');
  document.getElementById('app').innerHTML = `<div class="scroll" id="scr">${renderK()}</div>${renderLayer()}`;

}

}
let undoTimer=null;
function notifOpen(){ return S.modal&&S.modal.kind==='sheet'&&S.modal.title==='Notifikasi'; }
function swipeRead(i){ const arr=S.notif[S.me]; const it=arr.splice(i,1)[0]; if(!it) return; S.undo={u:S.me,it,i}; clearTimeout(undoTimer); undoTimer=setTimeout(()=>{ S.undo=null; render(); },2500); if(notifOpen()) openNotif(); else render(); }
function undoNotif(){ const u=S.undo; if(!u) return; (S.notif[u.u]=S.notif[u.u]||[]).splice(u.i,0,u.it); S.undo=null; clearTimeout(undoTimer); if(notifOpen()) openNotif(); else render(); }
function bindSwipes(){
  const app=document.getElementById('app');
  document.querySelectorAll('.nfrow').forEach(row=>{
    const inner=row.querySelector('.nfin'); let sx=0,sy=0,dx=0,active=false,lock=null,moved=false;
    row.addEventListener('pointerdown',e=>{ const r=app.getBoundingClientRect(); if(e.clientX-r.left<24||r.right-e.clientX<24){ active=false; return; } sx=e.clientX; sy=e.clientY; dx=0; active=true; lock=null; moved=false; inner.style.transition='none'; });
    row.addEventListener('pointermove',e=>{ if(!active) return; const x=e.clientX-sx, y=e.clientY-sy;
      if(lock===null && (Math.abs(x)>8||Math.abs(y)>8)){ lock=Math.abs(x)>Math.abs(y)?'h':'v'; if(lock==='h'){ try{ row.setPointerCapture(e.pointerId); }catch(_){} } }
      if(lock!=='h') return; moved=true; dx=x; inner.style.transform=`translateX(${dx}px)`; row.classList.toggle('l', dx<0); });
    const end=()=>{ if(!active) return; active=false; inner.style.transition='transform .18s';
      if(lock==='h' && Math.abs(dx)>row.offsetWidth/3){ inner.style.transform=`translateX(${dx>0?110:-110}%)`; setTimeout(()=>swipeRead(+row.dataset.i),170); }
      else inner.style.transform=''; };
    row.addEventListener('pointerup',end); row.addEventListener('pointercancel',end);
    inner.addEventListener('click',e=>{ if(moved){ e.preventDefault(); return; } notifGo(+row.dataset.i); });
  });
}
function notifGo(i){ const n=S.notif[S.me].splice(i,1)[0]; if(!n) return; S.modal=null; if(n.go.lap){ const l=lapByNo(n.go.lap); if(l&&canSeeLap(l)) openLap(l.no); else toastMsg('Laporan ini sudah tidak bisa Anda lihat.'); } else if(n.go.tugas){ const g=tugasById(n.go.tugas); if(g&&visibleTugas(progById(g.prog)).includes(g)) openTugas(g.id); else toastMsg('Tugas ini sudah tidak bisa Anda lihat.'); } else render(); }

function lapBadge(st){ return {Terkirim:'b-blue', Ditindaklanjuti:'b-gold', Ditolak:'b-red', Selesai:'b-green'}[st]; }
function openLapList(){ S.lapFilter='Semua'; S.lapQ=''; go('lapList'); }
function lapTabs(){ const t=[['saya','Laporan saya']]; if(ledTeam(S.me)) t.push(['tim','Laporan tim']); if(isOwner(S.me)) t.push(['semua','Semua laporan']); return t; }
function lapsFor(tab){
  const u=S.me, mine=l=>l.from===u||l.to===u||l.cc.includes(u);
  let arr;
  if(tab==='saya') arr=S.lap.filter(mine);
  else if(tab==='tim'){ const t=ledTeam(u); arr=S.lap.filter(l=>t && t.staff.includes(l.to) && !mine(l)); }
  else arr=S.lap.filter(()=>isOwner(u));
  if(S.lapFilter!=='Semua') arr=arr.filter(l=>l.status===S.lapFilter);
  /* K-T81: cari no. laporan & judul, di dalam tab dan filter aktif */
  const q=(S.lapQ||'').trim().toLowerCase(); if(q) arr=arr.filter(l=>l.no.toLowerCase().includes(q)||l.judul.toLowerCase().includes(q));
  return arr.sort((a,b)=>b.no.localeCompare(a.no));
}
function lapCard(l){
  const unread=l.to===S.me && !l.readTo && !lapClosed(l);
  const peran=l.from===S.me?'Saya → '+nm(l.to):l.to===S.me?nm(l.from)+' → saya':l.cc.includes(S.me)?'CC · '+nm(l.from)+' → '+nm(l.to):nm(l.from)+' → '+nm(l.to);
  return `<div class="lapcard ${unread?'unread':''}" role="button" tabindex="0" onclick="openLap('${l.no}')">
    <div class="l1"><span>${unread?'<span class="dot"></span>':''}${l.no} · ${l.jenis}</span><span class="badge ${lapBadge(l.status)}">${l.status}</span></div>

    <div class="l3">${esc(peran)} · ${ago(l.created)}${l.chat.filter(c=>!c.sys).length?' · '+l.chat.filter(c=>!c.sys).length+' pesan':''}</div></div>`;
}

function lapFwd(){ const l=lapByNo(S.k.ref); openPick('Teruskan ke', pickUsers([l.to, l.from]), u=>{

}
function editTodo(id){ const g=tugasById(S.k.ref), x=g.todos.find(t=>t.id===id), t=teamById(progById(g.prog).team);
  todoForm(x, t, 'Edit to-do', v=>{ const ch=[]; if(v.pic!==x.pic) ch.push('PIC '+nm(x.pic)+' → '+nm(v.pic)); if(iso(x.dl)!==v.dl) ch.push('DL '+fmtS(x.dl)+' → '+fmtS(fromIso(v.dl))); if(v.nama!==x.nama) ch.push('nama'); if(v.arahan!==x.arahan) ch.push('arahan');
    if(v.pic!==x.pic) notify(v.pic,'To-do dialihkan ke Anda: "'+v.nama+'"',{tugas:g.id});
    Object.assign(x,{nama:v.nama, arahan:v.arahan, pic:v.pic, dl:fromIso(v.dl), reassign:false}); if(ch.length) logT(g,'mengubah "'+x.nama+'": '+ch.join(', ')); S.modal=null; toast('To-do diperbarui.'); render(); },
  ()=>{ S.modal=null; confirmSheet('Hapus to-do?','"'+esc(x.nama)+'" dihapus dari tugas dan tercatat di riwayat.','Hapus',()=>{ g.todos=g.todos.filter(t=>t.id!==id); logT(g,'menghapus "'+x.nama+'"'); if(!g.todos.length) toast('To-do terakhir dihapus. Tambahkan to-do baru agar QC bisa dilakukan.'); else toast('To-do dihapus.'); }, true); }); }
function addTodo(){ const g=tugasById(S.k.ref), t=teamById(progById(g.prog).team);
  todoForm(blankTodo(), t, 'Tambah to-do', v=>{ const x=Object.assign(blankTodo(),{nama:v.nama, arahan:v.arahan, pic:v.pic, dl:fromIso(v.dl)}); g.todos.push(x); logT(g,'menambah "'+x.nama+'"'); notify(x.pic,'To-do baru di "'+g.nama+'"',{tugas:g.id}); S.modal=null; toast('To-do ditambahkan.'); render(); }); }
function qcOk(){ const g=tugasById(S.k.ref); confirmSheet('Approve QC?','Tugas akan tertutup otomatis. Pekerjaan setelah QC dibuat sebagai tugas baru.','Approve QC',()=>{ g.closed=true; logT(g,'approve QC · tugas selesai'); [...new Set(g.todos.map(t=>t.pic))].forEach(u=>notify(u,'"'+g.nama+'" lolos QC',{tugas:g.id})); toast('QC lolos. Tugas selesai.'); }); }
function qcFail(){ const g=tugasById(S.k.ref);
  sheet('Kembalikan untuk revisi', `<div id="qcErr"></div><div class="small muted" style="margin-bottom:6px">Pilih to-do yang perlu direvisi, lalu tulis catatan untuk masing-masing.</div>${g.todos.map((x,i)=>`<div style="border-bottom:1px dashed var(--line);padding:6px 0"><label class="chk" style="margin:0"><input type="checkbox" id="qc${i}" onchange="document.getElementById('qcw${i}').style.display=this.checked?'block':'none'"><span>${esc(x.nama)}<br><small class="muted">${nm(x.pic)}</small></span></label><div id="qcw${i}" style="display:none;margin-top:6px"><textarea id="qcN${i}" class="inp" style="min-height:52px" placeholder="Catatan revisi untuk ${esc(x.nama)} (wajib)"></textarea></div></div>`).join('')}`,
    [{t:'Batal',cls:'sec',fn:closeModal},{t:'Kembalikan',cls:'warn',fn:()=>{
      const pick=g.todos.map((x,i)=>({x, on:document.getElementById('qc'+i).checked, note:document.getElementById('qcN'+i).value.trim()})).filter(o=>o.on);
      const miss=pick.find(o=>!o.note);
      const err=!pick.length?'PNG-QC-01: Pilih to-do yang perlu direvisi.':miss?`PNG-QC-02: Catatan revisi "${esc(miss.x.nama)}" wajib diisi.`:'';
      if(err){ document.getElementById('qcErr').innerHTML=`<div class="alert err" style="margin-bottom:8px">${err}</div>`; return; }
      pick.forEach(o=>{ o.x.done=false; o.x.rev++; o.x.revNote=o.note; notify(o.x.pic,'Revisi: "'+o.x.nama+'" di "'+g.nama+'"',{tugas:g.id}); });
      logT(g,'mengembalikan '+pick.length+' to-do untuk revisi'); S.modal=null; toast(pick.length+' to-do dikembalikan untuk revisi.'); render(); }}]); }

/* =========================================================
   PEMETAAN TIM (pemilik)
   ========================================================= */
function vTim(){
  if(!isOwner(S.me)) return hd('Pemetaan tim')+'<div class="pad"><div class="alert err">PNG-TIM-06: Hanya pemilik yang bisa mengatur pemetaan tim.</div></div>';
  return hd('Pemetaan tim','Hanya pemilik')+`<div class="pad">
    <div class="card">${OWNERS.map(o=>`<div class="tm"><div class="av">${initials(o)}</div><div><b>${nm(o)}</b><div class="small muted">Pemilik (tetap)</div></div></div>`).join('')}
    <div class="tree">${S.teams.map(t=>`<div class="tcard" role="button" tabindex="0" onclick="editTim('${t.id}')" style="border-left:4px solid ${t.warna}"><div class="tt">${teamChip(t)}<span class="muted">${ic('pen',16)}</span></div>
      <div class="tm"><div class="av">${initials(t.leader)}</div><div><b>${nm(t.leader)}</b><div class="small muted">Leader</div></div></div>
      ${t.staff.map(u=>`<div class="tm"><div class="av" style="background:var(--surface2);color:var(--muted)">${initials(u)}</div><div>${nm(u)}<div class="small muted">Staff${S.teams.filter(x=>x.id!==t.id&&(x.staff.includes(u)||x.leader===u)).length?' · rangkap':''}</div></div></div>`).join('')}</div>`).join('')}</div></div>
    <button class="btn block mt" onclick="editTim(null)">${ic('plus',18)} Tambah tim</button>
    <p class="small muted mt">Daftar nama diambil dari pengguna Jubelio. Satu orang hanya boleh menjadi leader di 1 tim, tetapi boleh menjadi staff di beberapa tim.</p></div>`;
}
function editTim(id){ if(!id && !PALET.some(c=>!S.teams.some(x=>x.warna===c[0]))){ toast('PNG-TIM-08: Semua 8 warna tim sudah dipakai. Tim baru belum bisa ditambahkan.'); render(); return; } go('timEdit', id, ()=>{ const t=id?teamById(id):null; S.f={nama:t?t.nama:'', warna:t?t.warna:(PALET.find(c=>!S.teams.some(x=>x.warna===c[0]))||PALET[0])[0], leader:t?t.leader:null, staff:t?[...t.staff]:[], err:''}; }); }
function vTimEdit(){
  const f=S.f, id=S.k.ref;
  return hd(id?'Edit tim':'Tambah tim')+`<div class="pad">${f.err?`<div class="alert err">${f.err}</div>`:''}
    <div class="card ${f.err?'mt':''}"><label class="lab" for="tmN">Nama tim</label><input id="tmN" class="inp" value="${esc(f.nama)}" oninput="S.f.nama=this.value" placeholder="Contoh: Tim Toko">
    <label class="lab mt">Warna tim</label><div style="display:flex;flex-wrap:wrap;gap:8px">${PALET.map(c=>{ const u=S.teams.find(x=>x.warna===c[0]&&x.id!==id); return `<button class="swatch ${f.warna===c[0]?'on':''} ${u?'used':''}" style="background:${c[0]}" onclick="pickWarna('${c[0]}')" aria-label="${c[1]}${u?' (dipakai '+esc(u.nama)+')':''}" title="${c[1]}${u?' — dipakai '+esc(u.nama):''}">${u?ic('x',14):''}</button>`; }).join('')}</div><div class="small muted" style="margin-top:6px">Warna bertanda silang sudah dipakai tim lain.</div>
    <div class="small muted" style="margin-top:6px">Pratinjau: ${teamChip({nama:f.nama||'Nama tim', warna:f.warna})}</div>
    <label class="lab mt">Leader (1 orang)</label><button class="picker" onclick="openPick('Pilih leader', pickUsers([...OWNERS]), u=>{S.f.leader=u;S.f.staff=S.f.staff.filter(x=>x!==u);})">${f.leader?`<span>${nm(f.leader)}</span>`:'<span class="ph">Pilih pengguna Jubelio</span>'}<span class="muted">›</span></button>
    <label class="lab mt">Staff (1 atau lebih)</label><div>${f.staff.map(u=>`<span class="mchip">${nm(u)}<button onclick="rmStaff('${u}')" aria-label="Keluarkan">${ic('x',14)}</button></span>`).join('')}</div>
    <button class="btn sec sm mt" onclick="openPick('Tambah staff', pickUsers([...OWNERS, S.f.leader, ...S.f.staff].filter(Boolean)), u=>{S.f.staff.push(u);})">${ic('plus',16)} Tambah staff</button></div>
    <button class="btn block mt2" onclick="saveTim()">Simpan tim</button></div>`;
}
function openTodosOf(u, teamId){ return S.tugas.filter(g=>!g.closed && progById(g.prog).team===teamId && progById(g.prog).status==='Aktif').reduce((a,g)=>a+g.todos.filter(t=>t.pic===u&&!t.done).length,0); }
function rmStaff(u){ const id=S.k.ref, n=id?openTodosOf(u,id):0;
  if(!n){ S.f.staff=S.f.staff.filter(x=>x!==u); render(); return; }
  confirmSheet('Keluarkan '+nm(u)+'?', `${nm(u)} masih punya <b>${n} to-do aktif</b> di tim ini. Idealnya diselesaikan lewat handover dulu. Jika tetap dikeluarkan, to-do tersebut ditandai <b>Perlu dialihkan</b> setelah tim disimpan.`, 'Tetap keluarkan', ()=>{ S.f.staff=S.f.staff.filter(x=>x!==u); (S.f.removed=S.f.removed||[]).push(u); }, true); }
function pickWarna(w){ const id=S.k.ref, u=S.teams.find(x=>x.warna===w&&x.id!==id); if(u){ S.f.err=`PNG-TIM-07: Warna ini sudah dipakai ${u.nama}. Pilih warna lain.`; } else { S.f.warna=w; if(S.f.err&&S.f.err.startsWith('PNG-TIM-07')) S.f.err=''; } render(); }
function saveTim(){
  const f=S.f, id=S.k.ref;
  const other=f.leader && S.teams.find(t=>t.leader===f.leader && t.id!==id);
  if(!f.nama.trim()) f.err='PNG-TIM-01: Nama tim belum diisi.';
  else if(!f.leader) f.err='PNG-TIM-02: Pilih leader tim.';
  else if(other) f.err=`PNG-TIM-03: ${nm(f.leader)} sudah menjadi leader di ${other.nama}. Satu orang hanya boleh leader di 1 tim.`;
  else if(!f.staff.length) f.err='PNG-TIM-04: Pilih minimal 1 staff.';
  else if(S.teams.some(x=>x.warna===f.warna&&x.id!==id)) f.err=`PNG-TIM-07: Warna ini sudah dipakai ${S.teams.find(x=>x.warna===f.warna&&x.id!==id).nama}. Pilih warna lain.`;
  else f.err='';
  if(f.err){ render(); return; }
  let msg='Tim disimpan.';
  if(id){ const t=teamById(id); const oldLd=t.leader; Object.assign(t,{nama:f.nama.trim(), warna:f.warna, leader:f.leader, staff:[...f.staff]});
    if(oldLd!==f.leader){ notify(f.leader,'Anda menjadi leader '+t.nama+'. QC yang tertunda pindah ke Anda.',{}); msg='Tim disimpan. QC yang tertunda pindah ke '+nm(f.leader)+'.'; }
    (f.removed||[]).forEach(u=>{ if(t.staff.includes(u)||t.leader===u) return; S.tugas.filter(g=>!g.closed&&progById(g.prog).team===id).forEach(g=>g.todos.forEach(x=>{ if(x.pic===u&&!x.done) x.reassign=true; })); notify(t.leader, nm(u)+' keluar dari '+t.nama+'. Ada to-do yang perlu dialihkan.',{}); });
  } else S.teams.push({id:uid('t'), nama:f.nama.trim(), warna:f.warna, leader:f.leader, staff:[...f.staff]});
  back(); toast(msg); render();
}

/* =========================================================
   TEMPLATE (leader)
   ========================================================= */
function vTpl(){
  const t=ledTeam(S.me);
  if(!t) return hd('Template to-do list')+'<div class="pad"><div class="alert err">PNG-TPL-03: Template hanya bisa dikelola leader tim.</div></div>';
  const arr=S.tpl.filter(x=>x.team===t.id);
  return hd('Template to-do list', teamChip(t))+`<div class="pad"><button class="btn block" onclick="editTpl(null)">${ic('plus',18)} Buat template</button>
    ${arr.map(x=>`<div class="tcard" role="button" tabindex="0" onclick="editTpl('${x.id}')"><div class="tt"><b>${esc(x.nama)}</b><span class="muted">${ic('pen',16)}</span></div><div class="ts">${x.todos.length} to-do · ${esc(x.todos.join(', '))}</div></div>`).join('')||'<div class="empty">Belum ada template.</div>'}
    <p class="small muted mt">Template hanya berisi nama dan daftar to-do. Arahan, PIC, dan DL diisi saat template dipakai.</p></div>`;
}
function editTpl(id){ go('tplEdit', id, ()=>{ const x=id?S.tpl.find(t=>t.id===id):null; S.f={nama:x?x.nama:'', todos:x?[...x.todos]:[''], err:''}; }); }
function vTplEdit(){
  const f=S.f, id=S.k.ref;
  return hd(id?'Edit template':'Buat template')+`<div class="pad">${f.err?`<div class="alert err">${f.err}</div>`:''}
    <div class="card ${f.err?'mt':''}"><label class="lab" for="tpN">Nama template</label><input id="tpN" class="inp" value="${esc(f.nama)}" oninput="S.f.nama=this.value" placeholder="Contoh: Materi Promosi">
    <label class="lab mt">Daftar to-do</label>
    ${f.todos.map((n,i)=>`<div class="srch" style="margin-top:6px"><input id="tpt${i}" class="inp" value="${esc(n)}" oninput="S.f.todos[${i}]=this.value" placeholder="To-do ${i+1}"><button class="icbtn" onclick="S.f.todos.splice(${i},1);render()" aria-label="Hapus">${ic('trash',16)}</button></div>`).join('')}
    <button class="btn sec sm mt" onclick="S.f.todos.push('');render()">${ic('plus',16)} Tambah to-do</button></div>
    <button class="btn block mt2" onclick="saveTpl()">Simpan template</button>
    ${id?`<button class="btn warn block mt" onclick="delTpl()">Hapus template</button>`:''}</div>`;
}
function saveTpl(){ const f=S.f, id=S.k.ref, todos=f.todos.map(x=>x.trim()).filter(Boolean);
  if(!f.nama.trim()) f.err='PNG-TPL-01: Nama template belum diisi.'; else if(!todos.length) f.err='PNG-TPL-02: Tambahkan minimal 1 to-do.'; else f.err='';
  if(f.err){ render(); return; }
  if(id) Object.assign(S.tpl.find(t=>t.id===id),{nama:f.nama.trim(), todos}); else S.tpl.push({id:uid('tp'), team:ledTeam(S.me).id, nama:f.nama.trim(), todos});
  back(); toast('Template disimpan. Tugas yang sudah berjalan tidak berubah.'); render(); }
function delTpl(){ confirmSheet('Hapus template?','Tugas yang sudah dibuat dari template ini tidak terpengaruh.','Hapus',()=>{ S.tpl=S.tpl.filter(t=>t.id!==S.k.ref); back(); toast('Template dihapus.'); }, true); }

render();

</script>
</body>
</html>
